name: desktop-release

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: CORE commit SHA that provides CORE-CLIENT
        required: false
        default: c1eaaaaa841301eac90beb55fdb9f2e3f2092580
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CORE_REF: ${{ github.event.inputs.core_ref || 'c1eaaaaa841301eac90beb55fdb9f2e3f2092580' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            artifact: macos-x86_64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: macos-arm64
          - name: Windows
            os: windows-latest
            artifact: windows-x86_64
          - name: Linux
            os: ubuntu-22.04
            artifact: linux-x86_64
    steps:
      - name: Check out the desktop application
        uses: actions/checkout@v4

      # Kishir298/CORE is the canonical combined repository (the old
      # CORE-HOST name redirects to it). The ref is pinned so a release never
      # depends on another repository's moving main branch.
      - name: Check out CORE-CLIENT dependency
        uses: actions/checkout@v4
        with:
          repository: Kishir298/CORE
          ref: ${{ env.CORE_REF }}
          path: CORE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `python3-tk` provides Tk for the distribution interpreter only, so the
      # Linux build runs from a virtualenv created with /usr/bin/python3
      # instead of the setup-python toolchain cache.
      - name: Prepare a Tk-enabled interpreter and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk dpkg-dev fakeroot
          /usr/bin/python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup wixtoolset --no-progress -y
          $env:Path += ';C:\Program Files (x86)\Inno Setup 6;C:\Program Files (x86)\WiX Toolset v3.11\bin;C:\Program Files (x86)\WiX Toolset v3.14\bin'
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append
          $missing = @('iscc', 'candle', 'light', 'heat') | Where-Object {
            -not (Get-Command $_ -ErrorAction SilentlyContinue)
          }
          if ($missing) { throw "Installer tools missing after setup: $($missing -join ', ')" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./CORE/CORE-CLIENT
          python -m pip install -e ".[test,package]"

      - name: Run tests and lint
        run: |
          python -m ruff check --select E9,F,I risarms_ui tests
          python -m pytest -q

      # A build agent has no display, so `--doctor` (which probes for one) is
      # not the right gate here. Packaging only needs Tk to be importable.
      - name: Verify Tk for the build interpreter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build artifacts and native installers
        run: python packaging/build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: risarms-desktop-${{ matrix.artifact }}
          path: |
            dist/RISARMS-Portal-*
            dist/risarms-portal*
            dist/*.dmg
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
