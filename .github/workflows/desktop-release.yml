name: desktop-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            artifact: macos-x86_64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: macos-arm64
          - name: Windows
            os: windows-latest
            artifact: windows-x86_64
          - name: Linux
            os: ubuntu-22.04
            artifact: linux-x86_64
    steps:
      - name: Check out the desktop application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `python3-tk` provides Tk for the distribution interpreter only, so the
      # Linux build runs from a virtualenv created with /usr/bin/python3
      # instead of the setup-python toolchain cache.
      - name: Prepare a Tk-enabled interpreter and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk dpkg-dev fakeroot
          /usr/bin/python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup wixtoolset --no-progress -y
          $env:Path += ';C:\Program Files (x86)\Inno Setup 6;C:\Program Files (x86)\WiX Toolset v3.11\bin;C:\Program Files (x86)\WiX Toolset v3.14\bin'
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append
          $missing = @('iscc', 'candle', 'light', 'heat') | Where-Object {
            -not (Get-Command $_ -ErrorAction SilentlyContinue)
          }
          if ($missing) { throw "Installer tools missing after setup: $($missing -join ', ')" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,package]"

      - name: Run tests and lint
        run: |
          python -m ruff check --select E9,F,I risarms_ui tests
          python -m pytest -q

      - name: Embed production update public key
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY || secrets.UPDATE_PUBLIC_KEY }}
        run: python packaging/embed_update_key.py

      # A build agent has no display, so `--doctor` (which probes for one) is
      # not the right gate here. Packaging only needs Tk to be importable.
      - name: Verify Tk for the build interpreter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build artifacts and native installers
        run: |
          python packaging/build.py
          python packaging/sbom.py --output dist/sbom.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: risarms-desktop-${{ matrix.artifact }}
          path: |
            dist/RISARMS-Portal-*
            dist/risarms-portal*
            dist/*.dmg
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
            dist/sbom.cdx.json
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out the desktop application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest signer
        run: python -m pip install --upgrade pip cryptography

      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p release
          find artifacts -type f -maxdepth 2 -exec cp {} release/ \;
          python packaging/release_manifest.py \
            --dist release \
            --version "$(raw="${GITHUB_REF_NAME#v}"; echo "${raw%%-*}")" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --channel "$(case "${GITHUB_REF_NAME}" in *-beta*) echo beta;; *) echo stable;; esac)"

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber
