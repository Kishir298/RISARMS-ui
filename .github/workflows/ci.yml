name: CI

on:
  push:
    # Feature and fix branches are validated on push so a candidate commit has
    # evidence before a pull request exists.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out the desktop application
        uses: actions/checkout@v4

      # The desktop application links against the native CORE-CLIENT library.
      # It is pinned to a commit so CI cannot drift with another repository.
      - name: Check out CORE-CLIENT
        uses: actions/checkout@v4
        with:
          repository: Kishir298/CORE
          ref: c1eaaaaa841301eac90beb55fdb9f2e3f2092580
          path: .core

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dependencies come from pyproject.toml. This repository has no
      # requirements.txt and must not be given one.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./.core/CORE-CLIENT"
          python -m pip install -e ".[test]"

      - name: Run lint
        run: python -m ruff check --select E9,F,I risarms_ui tests

      - name: Run tests
        run: python -m pytest -q
