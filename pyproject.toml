[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risarms-ui"
version = "0.6.0"
description = "R.I.S.A.R.M.S. unified desktop application for C.O.R.E. and its subsystems"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0",
  "keyring>=24.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
package = ["pyinstaller>=6.0"]

[project.scripts]
risarms-ui = "risarms_ui.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["risarms_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint]
select = ["E9", "F", "I"]
